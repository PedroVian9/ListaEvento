name: Deploy Casa Nova

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/pedrovian9/listaevento

jobs:
  deploy:
    name: Deploy Oracle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Deploy na Oracle
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$OCI_USER@$OCI_HOST" << EOF

            set -e

            echo "==> Atualizando repositório"
            cd /home/ubuntu/ListaEvento

            git fetch origin main
            git reset --hard origin/main

            echo "==> Autenticando no GHCR"
            echo "${{ github.token }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            echo "==> Baixando imagem"
            docker compose pull casanova

            echo "==> Atualizando container"
            docker compose up -d casanova

            echo "==> Limpando imagens antigas"
            docker image prune -f

            echo "==> Verificando aplicação"
            sleep 5

            curl \
              --fail \
              --silent \
              --show-error \
              https://casanova.pedrovian9.site/api/health

            echo ""
            echo "==> Deploy concluído"
          EOF